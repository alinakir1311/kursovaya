server {
    listen 80;
    server_name SITE_IP;
    location /.well-known/acme-challenge/ {
        root /var/www/avtoritm-acme;
    }
    location / {
        return 301 https://SITE_IP$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name SITE_IP;
    ssl_certificate /etc/letsencrypt/live/SITE_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SITE_IP/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;

    location /static/ {
        alias /var/lib/avtoritm/static/;
        expires 7d;
    }
    location /media/ {
        alias /var/lib/avtoritm/media/;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
